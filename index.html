<script>
(()=>{'use strict';

 {name:'Перша лавка',icon:'🪑',type:'Набір рейок',desc:'Три однакові деталі. Почни з простого.',boards:[2400,1800],parts:[[760,3]],tip:'Розмічай усі відрізки від одного базового торця.'},

 {name:'Садова лава',icon:'🌳',type:'Меблі для саду',desc:'Дві довгі та дві короткі деталі.',boards:[2400,1600,3000],parts:[[1180,2],[740,2]],tip:'Спершу подумай, які елементи варто різати з коротшої дошки.'},

 {name:'Письмовий стіл',icon:'🪵',type:'Меблі для дому',desc:'Опори, царги та перемички.',boards:[3000,2400,2000],parts:[[1450,2],[900,2],[560,1]],tip:'Для довгих деталей вибирай достатній запас, не забуваючи про пропил.'},

 {name:'Шафа для інструментів',icon:'🧰',type:'Складний проєкт',desc:'Сім деталей з трьох різних заготовок.',boards:[3000,3000,2000],parts:[[1400,3],[920,2],[610,2]],tip:'Правильна черговість різів інколи важливіша за довжину дошки.'},
 {name:'Великий верстак',icon:'⚒️',type:'Робоче місце',desc:'Складна задача на точність розкрою.',boards:[3000,3000,2400],parts:[[1420,3],[960,2],[650,2]],tip:'Спочатку склади повний план і лише після цього роби перший різ.'},

 {name:'Майстер столярства',icon:'🏆',type:'Фінальне замовлення',desc:'Дев’ять точних деталей. Фінальний іспит.',boards:[3000,3000,3000,1800],parts:[[1480,4],[990,2],[680,3]],tip:'План, послідовність і спокійна перевірка дають точніший результат.'}
];

function shell(body){return `<header class="top"><div class="brand"><span class="logo">${icon()}</span><div><strong>МАЙСТЕРНЯ</strong><small>ТОЧНИЙ РІЗ · 2026</small></div></div><div class="top-actions"><button class="iconbtn" data-action="sound" aria-label="${saved.sound?'Вимкнути':'Увімкнути'} звук" title="Звук">${saved.sound?'🔊':'🔇'}</button><button class="iconbtn" data-action="home" aria-label="Головна" title="Головна">⌂</button></div></header>${body}<footer class="foot">Зроблено з любов'ю до ремесла · Працює без мережі · Жодних покупок і реклами<br>Гра навчає планувати розкрій, але не замінює реальні правила безпеки з інструментом.</footer>`}
function home(){document.querySelector('.overlay')?.remove();const total=Object.values(saved.best).reduce((s,v)=>s+(Number(v)||0),0),done=Object.keys(saved.best).filter(k=>saved.best[k]>0).length;view='home';modal=null;app.innerHTML=shell(`<main><section class="hero"><div><div class="eyebrow">ПОБУДУЙ ВЛАСНУ МАЙСТЕРНЮ</div><h1>Точний <em>різ.</em></h1><p>Кожен міліметр має значення. Плануй розкрій дощок, збирай деталі для справжніх виробів і проходь 12 столярних замовлень без зайвих відходів.</p><div class="actions"><button class="btn primary" data-action="start">${done?'▶ Продовжити гру':'▶ Почати гру'}</button><button class="btn secondary" data-action="levels">Обрати замовлення ↓</button></div><div class="splash"><strong>Як грати:</strong> вибери дошку → вибери потрібну деталь → натисни «Зробити різ». Кожен пропил забирає 3 мм. Підказка допоможе, якщо застрягнеш.</div></div><div class="hero-art" aria-hidden="true"><svg class="wooddraw" viewBox="0 0 430 330" fill="none"><path d="M60 170L220 93L368 170L205 244Z" fill="#e4a669" stroke="#ffd597" stroke-width="5"/><path d="M60 170V204L205 279V244" fill="#a36d3d" stroke="#e0a466" stroke-width="4"/><path d="M205 244V279L368 203V170" fill="#835835" stroke="#e0a466" stroke-width="4"/><path d="M83 177l139-68M113 196l141-71M146 214l142-72M180 230l139-72" stroke="#96613d" stroke-width="3" opacity=".55"/><path d="M122 197V269M297 218V287" stroke="#f3c988" stroke-width="17"/><path d="M155 80l75 38M155 80l-7 35M155 80l51-19" stroke="#f0d4a1" stroke-width="5" stroke-dasharray="7 6"/><path d="M50 282h327M73 274v16M354 274v16" stroke="#9ad0b7" stroke-width="2"/><path d="M318 62l61 61" stroke="#f8d298" stroke-width="18"/><path d="M307 52l23 23M367 114l23 23" stroke="#df975b" stroke-width="18"/><path d="M337 100l24-24" stroke="#7a3c2a" stroke-width="10"/></svg><div class="seal">МАЙСТЕР<br>ТОЧНОСТІ</div></div></section><section class="stats"><div class="stat"><b>${done}/${LEVELS.length}</b><span>ЗАМОВЛЕНЬ ВИКОНАНО</span></div><div class="stat"><b>${total} ★</b><span>ЗІРОК ЗІБРАНО</span></div><div class="stat"><b>${saved.unlocked}</b><span>РІВНІВ ВІДКРИТО</span></div></section><section id="levels"><div class="section-head"><div><div class="eyebrow">ДОРОГА МАЙСТРА</div><h2>Замовлення</h2></div><p>12 випробувань</p></div><div class="levelgrid">${LEVELS.map((l,i)=>`<button class="levelcard" data-action="level" data-id="${i}" ${i>=saved.unlocked?'disabled aria-label="Рівень заблоковано"':''}><span class="num">ЗАМОВЛЕННЯ ${String(i+1).padStart(2,'0')}</span><span class="${i<saved.unlocked?'stars':'lock'}">${i<saved.unlocked?('★'.repeat(saved.best[i]||0)+'☆'.repeat(3-(saved.best[i]||0))):'🔒'}</span><div class="thumb">${l.icon}</div><div class="name">${esc(l.name)}</div><div class="meta">${esc(l.type)}</div></button>`).join('')}</div><div class="actions" style="justify-content:center;margin-top:28px"><button data-action="resetconfirm" class="btn ghost small">Скинути досягнення</button></div></section></main>`);if(location.hash==='#levels')setTimeout(()=>document.getElementById('levels')?.scrollIntoView({block:'start'}),1)}
function levelSetup(idx){const lvl=LEVELS[idx];game={idx,boards:lvl.boards.map((len,i)=>({id:i+1,initial:len,remain:len,touched:false,cuts:[]})),needed:lvl.parts.flatMap(([len,count])=>Array(count).fill(len)),done:[],history:[],extra:0,activeBoard:1,activePart:Math.max(...lvl.parts.map(x=>x[0]))};hintMsg='';view='game';modal=null;render()}
function starsFor(g){const touched=g.boards.filter(b=>b.touched);const used=touched.reduce((s,b)=>s+b.initial,0),good=g.done.reduce((s,x)=>s+x.len,0);const ratio=used?good/used:0;return g.extra>0?1:ratio>=.88?3:ratio>=.78?2:1}
function gameView(){const l=LEVELS[game.idx],remain=game.needed.length-game.done.length,complete=remain===0,unique=[...new Set(game.needed)];const bb=game.boards.find(x=>x.id===game.activeBoard),partValid=game.activePart!=null&&game.done.filter(x=>x.len===game.activePart).length<game.needed.filter(x=>x===game.activePart).length;const canCut=bb&&partValid&&(bb.remain===game.activePart||bb.remain>=game.activePart+KERF);const all=game.needed.length;return `<main><div class="gamebar"><div><div class="eyebrow">ЗАМОВЛЕННЯ ${String(game.idx+1).padStart(2,'0')} / 12 · ${esc(l.type)}</div><h1>${l.icon} ${esc(l.name)}</h1></div><span class="tag">🪚 Пропил: ${KERF} мм</span></div><div class="game-layout"><section class="panel"><div class="blueprint"><h2>Креслення замовлення</h2><p>${esc(l.desc)}</p>${drawing(game.idx)}</div><div class="panel-inner"><div class="panel-title"><h2>01 · Дошки</h2><small>Натисни, щоб вибрати</small></div><div class="boardlist">${game.boards.map(b=>`<button class="board ${b.id===game.activeBoard?'selected':''}" data-action="board" data-id="${b.id}" ${b.remain===0?'disabled':''} aria-pressed="${b.id===game.activeBoard}"><div class="board-top"><span>Заготовка ${b.id}${b.id>l.boards.length?' · додаткова':''}</span><b>${num(b.remain)} / ${num(b.initial)} мм</b></div><div class="ruler ${b.remain===0?'empty':''}"><div class="boardline" style="width:${Math.max(0,Math.min(100,100*b.remain/b.initial))}%"></div></div>${b.cuts.length?`<div class="cutshapes">${b.cuts.map(n=>`<span class="cutshape">${num(n)} мм ✓</span>`).join('')}</div>`:''}</button>`).join('')}</div><div class="tools"><button class="btn secondary small" data-action="extra">＋ Додати дошку</button><button class="btn ghost small" data-action="undo" ${game.history.length?'':'disabled'}>↶ Скасувати різ</button></div><p class="notice">Можна додати дошку 2400 мм, якщо помилився. Але тоді за замовлення буде максимум 1 зірка.</p></div></section><section class="panel"><div class="panel-inner"><div class="panel-title"><h2>02 · Деталі</h2><small>Вибери довжину</small></div><div class="partgrid">${unique.sort((a,b)=>b-a).map(len=>{const need=game.needed.filter(x=>x===len).length,got=game.done.filter(x=>x.len===len).length;return `<button class="part ${got===need?'done':''} ${game.activePart===len?'selected':''}" data-action="part" data-id="${len}" ${got===need?'disabled':''} aria-pressed="${game.activePart===len}"><b>${num(len)} мм</b><small>${got} з ${need} готово ${got===need?'✓':''}</small></button>`}).join('')}</div><div class="controlzone"><div class="tiny">ПОТОЧНИЙ РІЗ</div><div class="choice">${complete?'Усі деталі готові!':bb&&partValid?`Дошка <b>№${bb.id}</b> · потрібно <b>${num(game.activePart)} мм</b><br>${canCut?`Залишиться <b>${num(bb.remain-game.activePart-(bb.remain===game.activePart?0:KERF))} мм</b>`:'Недостатньо довжини. Вибери іншу дошку.'} `:'Обери дошку та деталь для розкрою.'}</div><button class="btn primary saw-btn" data-action="cut" ${canCut&&!complete?'':'disabled'}>✂ ЗРОБИТИ РІЗ</button></div><div class="tools"><button class="btn secondary small" data-action="hint">💡 Підказка</button><button class="btn ghost small" data-action="restartconfirm">⟲ Почати заново</button></div>${hintMsg?`<div class="hint" role="status">${esc(hintMsg)}</div>`:''}</div><div class="panel-inner" style="border-top:1px solid #456359"><div class="panel-title"><h2>03 · Результат</h2><small>${game.done.length}/${all} деталей</small></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${all}" aria-valuenow="${game.done.length}"><span style="width:${100*game.done.length/all}%"></span></div><div class="factgrid" style="margin-top:15px"><div class="fact"><span>Виготовлено</span><strong>${game.done.length}/${all}</strong></div><div class="fact"><span>Використано дощок</span><strong>${game.boards.filter(b=>b.touched).length}</strong></div></div><div class="panel-title" style="margin:19px 0 10px"><h2 style="font-size:18px">Журнал майстра</h2></div><div class="log">${game.done.length?game.done.slice().reverse().map((x,i)=>`<p>✓ ${num(x.len)} мм · дошка №${x.board}</p>`).join(''):'<p>Перший різ ще попереду.</p>'}</div><div class="hint" style="margin-top:16px">📖 <b>Нотатка майстра:</b> ${esc(l.tip)}</div></div></section></div></main>`}
function drawing(idx){const c=['#eab476','#d49a64','#a7bc9c'],n=idx%4;const width=[190,250,225,235][n],leg=[96,112,84,102][n];return `<svg class="drawing" viewBox="0 0 400 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Умовна схема виробу"><g fill="none" stroke="#9bd0b5" stroke-width="1.5" stroke-dasharray="5 6"><path d="M42 138h323M69 25v125M329 25v125"/></g><g stroke="#815a39" stroke-width="4"><path d="M${200-width/2} 64l${width*.65} -39 ${width*.38} 35 -${width*.65} 40z" fill="${c[0]}"/><path d="M${200-width/2} 64v21l${width*.38} 39v-24z" fill="${c[1]}"/><path d="M${200-width/2+width*.38} 100l${width*.65} -40v23l-${width*.65} 41z" fill="#a66f43"/><path d="M${200-width/2+20} 104v${leg*.42}m${width*.7} -34v${leg*.42}" stroke="#dfae73" stroke-width="13"/></g><g stroke="#bad5c4" stroke-width="1.5"><path d="M${200-width/2} 15h${width*.8}m-${width*.8} -4v8m${width*.8} -8v8"/><path d="M345 58v65m-5-65h10m-10 65h10"/></g><g fill="#c1d9c8" font-size="12" font-family="monospace"><text x="154" y="13">ПЛАН</text><text x="351" y="95">мм</text></g></svg>`}
function render(){document.querySelector('.overlay')?.remove();if(view==='home'){home();return;}app.innerHTML=shell(gameView());if(modal)showModal()}
function snd(freq=520){if(!saved.sound)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='triangle';osc.frequency.setValueAtTime(freq,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(freq*.7,ctx.currentTime+.12);gain.gain.setValueAtTime(.055,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.17);osc.start();osc.stop(ctx.currentTime+.18);osc.onended=()=>ctx.close()}catch(e){}}
function toast(s){document.querySelector('.toast')?.remove();const x=document.createElement('div');x.className='toast';x.setAttribute('role','status');x.textContent=s;document.body.appendChild(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),2600)}
function cut(){const b=game.boards.find(x=>x.id===game.activeBoard),len=game.activePart;if(!b||len==null||game.done.filter(x=>x.len===len).length>=game.needed.filter(x=>x===len).length){toast('Вибери доступну деталь.');return;}if(b.remain<len||(b.remain!==len&&b.remain<len+KERF)){toast('Для цього різу потрібна довша дошка.');return;}game.history.push(JSON.stringify({boards:game.boards,done:game.done,extra:game.extra}));b.remain-=len+(b.remain===len?0:KERF);b.touched=true;b.cuts.push(len);game.done.push({len,board:b.id});hintMsg='';snd(280);try{navigator.vibrate?.(24)}catch(e){}const flash=document.createElement('div');flash.className='sawflash';document.body.appendChild(flash);setTimeout(()=>flash.remove(),250);const next=game.needed.filter(x=>game.done.filter(d=>d.len===x).length<game.needed.filter(y=>y===x).length);game.activePart=next.length?Math.max(...next):null;if(!next.length){finish();return;}if(b.remain<Math.min(...next))game.activeBoard=game.boards.find(x=>x.remain>=Math.min(...next)+KERF)?.id||game.activeBoard;render()}
function solveHint(){
 const needs={};game.needed.forEach(len=>needs[len]=(needs[len]||0)+1);game.done.forEach(d=>needs[d.len]--);
 const pieces=Object.entries(needs).flatMap(([len,count])=>Array(Math.max(0,count)).fill(Number(len))).sort((a,b)=>b-a);
 const available=game.boards.filter(b=>b.remain>0);
 const options=[];
 for(let mask=1;mask<(1<<available.length);mask++){
  const chosen=available.filter((_,i)=>mask&(1<<i));
  if(chosen.reduce((s,b)=>s+b.remain,0)<pieces.reduce((s,x)=>s+x,0))continue;
  const alreadyUsed=game.boards.filter(b=>b.touched).reduce((s,b)=>s+b.initial,0);
  const newCost=chosen.filter(b=>!b.touched).reduce((s,b)=>s+b.initial,0);
  options.push({chosen,cost:alreadyUsed+newCost});
 }
 options.sort((a,b)=>a.cost-b.cost||a.chosen.length-b.chosen.length);
 for(const option of options){
  const boards=option.chosen.map(b=>b.remain),memo=new Set();let nodes=0;
  function recur(i){
   if(i===pieces.length)return [];
   if(nodes++>120000)return null;
   const key=i+'|'+boards.slice().sort((a,b)=>a-b).join(',');
   if(memo.has(key))return null;
   const p=pieces[i],tried=new Set();
   for(let j=0;j<boards.length;j++){
    const old=boards[j];if(old<p||(old!==p&&old<p+KERF)||tried.has(old))continue;
    tried.add(old);boards[j]-=p+(old===p?0:KERF);
    const next=recur(i+1);boards[j]=old;
    if(next!==null)return [{b:option.chosen[j].id,p},...next];
   }
   memo.add(key);return null;
  }
  const plan=recur(0);if(plan!==null)return plan;
 }
 return null;
}
function hint(){const path=solveHint();if(path&&path.length){game.activeBoard=path[0].b;game.activePart=path[0].p;hintMsg=`Спробуй вирізати ${num(path[0].p)} мм із дошки №${path[0].b}. Я знайшов шлях до виконання замовлення.`;render()}else{hintMsg='З поточних залишків усі деталі вже не скласти. Скасуй кілька різів, почни заново або додай дошку.';render()}}
function finish(){let stars=starsFor(game),prev=saved.best[game.idx]||0;saved.best[game.idx]=Math.max(prev,stars);saved.unlocked=Math.max(saved.unlocked,Math.min(LEVELS.length,game.idx+2));persist();snd(780);const used=game.boards.filter(x=>x.touched).reduce((s,b)=>s+b.initial,0),good=game.done.reduce((s,x)=>s+x.len,0),eff=used?Math.round(good/used*100):0;modal={kind:'win',stars,eff,prev};render()}
function showModal(){document.querySelector('.overlay')?.remove();if(!modal)return;let html='';if(modal.kind==='win'){const final=game.idx===LEVELS.length-1;html=`<div class="trophy">${final?'🏆':'🪚'}</div><div class="eyebrow">ЗАМОВЛЕННЯ ВИКОНАНО</div><h2>${final?'Ти — майстер!':'Чудова робота!'}</h2><div class="stars" aria-label="${modal.stars} із 3 зірок">${'★'.repeat(modal.stars)}${'☆'.repeat(3-modal.stars)}</div><p>Всі ${game.done.length} деталей готові. Ефективність використаної деревини: <b>${modal.eff}%</b>.${game.extra?' Додаткова дошка знизила оцінку.':''}</p><div class="actions"><button class="btn secondary" data-action="again">⟲ Переграти</button>${!final?`<button class="btn primary" data-action="next">Наступне замовлення →</button>`:`<button class="btn primary" data-action="home">До колекції →</button>`}</div>`}else if(modal.kind==='resetconfirm'){html=`<div class="trophy">↺</div><h2>Скинути прогрес?</h2><p>Усі зароблені зірки та відкриті замовлення буде втрачено.</p><div class="actions"><button class="btn secondary" data-action="closemodal">Скасувати</button><button class="btn danger" data-action="reset">Так, скинути</button></div>`}else{html=`<div class="trophy">🪵</div><h2>Почати спочатку?</h2><p>Розкрій поточного замовлення буде очищено. Збережені рекорди залишаться.</p><div class="actions"><button class="btn secondary" data-action="closemodal">Повернутися</button><button class="btn primary" data-action="again">Почати заново</button></div>`}const o=document.createElement('div');o.className='overlay';o.setAttribute('role','presentation');o.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Результат замовлення">${html}</div>`;document.body.appendChild(o);o.querySelector('button')?.focus()}
app.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action,id=Number(btn.dataset.id);if(a==='home'){home();scrollTo({top:0,behavior:'instant'});return}if(a==='sound'){saved.sound=!saved.sound;persist();render();if(saved.sound)snd();return}if(a==='levels'){document.getElementById('levels')?.scrollIntoView({behavior:'smooth'});return}if(a==='start'){levelSetup(Math.min(saved.unlocked-1,LEVELS.length-1));return}if(a==='level'){if(id<saved.unlocked)levelSetup(id);return}if(a==='board'){game.activeBoard=id;hintMsg='';render();return}if(a==='part'){game.activePart=id;hintMsg='';render();return}if(a==='cut'){cut();return}if(a==='hint'){hint();return}if(a==='undo'){const snapshot=game.history.pop();if(!snapshot)return;const snap=JSON.parse(snapshot);Object.assign(game,snap);game.activeBoard=game.boards.find(x=>x.remain>0)?.id||1;game.activePart=game.needed.find(x=>game.done.filter(d=>d.len===x).length<game.needed.filter(y=>y===x).length)||null;hintMsg='';render();return}if(a==='extra'){if(game.extra>=2){toast('Можна додати не більше двох дощок.');return}game.history.push(JSON.stringify({boards:game.boards,done:game.done,extra:game.extra}));const nextId=Math.max(...game.boards.map(x=>x.id))+1;game.boards.push({id:nextId,initial:2400,remain:2400,touched:false,cuts:[]});game.extra++;game.activeBoard=nextId;hintMsg='';render();toast('Додано дошку 2400 мм; максимум 1 зірка.');return}if(a==='restartconfirm'||a==='resetconfirm'){modal={kind:a};showModal();return}});
document.addEventListener('click',e=>{const b=e.target.closest('.overlay button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='closemodal'){modal=null;document.querySelector('.overlay')?.remove();return}if(a==='again'){levelSetup(game.idx);return}if(a==='next'){levelSetup(Math.min(LEVELS.length-1,game.idx+1));return}if(a==='home'){home();scrollTo(0,0);return}if(a==='reset'){saved={unlocked:1,best:{},sound:saved.sound};persist();home();toast('Прогрес очищено.');return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal&&modal.kind!=='win'){modal=null;document.querySelector('.overlay')?.remove()}if(e.key==='Enter'&&view==='game'&&!modal&&e.target.tagName==='BODY')cut()});
window.addEventListener('pageshow',()=>{});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));home();
})();
</script>
